<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Fresclean POS</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://cdn.fresclean.id" />
  <!-- The wordmark heads every screen and is the biggest thing on the sign-in
       page; found only once the app has run, it held that page's paint back. -->
  <link rel="preload" as="image" href="/receipt-logo.webp" fetchpriority="high" />
  <meta name="apple-mobile-web-app-title" content="Fresclean POS" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- iOS only reaches for a launch screen when the prefixed one says the app is
       standalone; without it every staff phone opens on a white flash. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#252525" />
  <meta name="color-scheme" content="light dark" />
  <!-- Sets the theme before the first paint, so a phone in dark mode doesn't
       open on a white screen. ThemeProvider takes over once React runs. -->
  <script>
    {
      let stored = null;
      try {
        stored = localStorage.getItem("vite-ui-theme");
      } catch {
        // storage blocked: follow the phone
      }
      const isDark =
        stored === "dark" ||
        (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", isDark);
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
